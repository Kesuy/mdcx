name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run ruff format
        run: uvx ruff@0.15.12 format --check

      - name: Run ruff check
        run: uvx ruff@0.15.12 check --output-format=github

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MDCX_OFFLINE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run --locked pytest tests -q
