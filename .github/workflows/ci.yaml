name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run ruff format
        shell: bash
        run: |
          if ! uvx ruff@0.15.12 format --check; then
            uvx ruff@0.15.12 format --diff
            exit 1
          fi

      - name: Run ruff check
        shell: bash
        run: |
          if ! uvx ruff@0.15.12 check --output-format=github; then
            uvx ruff@0.15.12 check --fix --diff
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      MDCX_OFFLINE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect UI changes
        id: ui_changes
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- \
            mdcx/views/ \
            mdcx/controllers/main_window/responsive_layout.py \
            mdcx/controllers/main_window/settings_composites.py \
            mdcx/controllers/main_window/settings_page.py \
            mdcx/controllers/main_window/accessibility.py \
            scripts/capture_settings_ui.py \
            scripts/smoke_main_window.py \
            main.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Qt runtime libraries and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libfontconfig1 \
            libfreetype6 \
            libgl1 \
            libglib2.0-0 \
            libx11-6 \
            libxcb-cursor0 \
            libxcb-glx0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            fonts-noto-cjk
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Run tests
        run: uv run pytest -q --disable-warnings
      - name: Capture settings UI screenshots
        if: always() && steps.ui_changes.outputs.changed == 'true'
        shell: bash
        run: |
          rm -rf artifacts/settings-ui
          uv run python scripts/capture_settings_ui.py --output-dir artifacts/settings-ui --strict
      - name: Upload settings UI screenshots
        if: always() && steps.ui_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: settings-ui-screenshots
          path: artifacts/settings-ui
          retention-days: 7
      - name: Create source snapshot
        if: always()
        shell: bash
        run: |
          git archive --format=zip --output=artifacts/source-snapshot.zip HEAD
      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: artifacts/source-snapshot.zip
          retention-days: 7

  windows:
    name: Windows smoke and debug build
    runs-on: windows-latest
    timeout-minutes: 35
    needs: [quality, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Smoke main window
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:MDCX_OFFLINE = "1"
          uv run python scripts/smoke_main_window.py
      - name: Build Windows debug EXE
        shell: pwsh
        run: |
          uv run python -m scripts.build --skip-tests --release-tag "debug-${{ github.sha }}"
      - name: Smoke packaged EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) {
            throw "No packaged EXE was produced in dist/"
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:MDCX_OFFLINE = "1"
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Packaged EXE exited early with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
      - name: Upload Windows debug EXE
        uses: actions/upload-artifact@v4
        with:
          name: MDCx-Windows-debug
          path: dist/*.exe
          retention-days: 7
