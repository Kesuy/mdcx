name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run ruff format
        run: uvx ruff@0.15.12 format --check

      - name: Run ruff check
        run: uvx ruff@0.15.12 check --output-format=github

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      MDCX_OFFLINE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC"
      - name: Install Qt runtime libraries
        run: sudo apt-get install --no-install-recommends -y libegl1
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run --locked pytest tests -q -rs

  windows-smoke:
    name: Windows smoke and debug build
    needs: [quality, test]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      MDCX_OFFLINE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run core and controller tests
        run: >-
          uv run --locked pytest tests/core tests/controllers
          tests/test_file_crawler_runtime.py tests/test_scrape_session.py
          tests/test_failure_model.py tests/test_provenance.py -q -rs
      - name: Construct main window offscreen
        run: uv run --locked python scripts/smoke_main_window.py
      - name: Build Windows executable
        run: uv run --locked scripts/build.py --debug
      - name: Smoke test frozen executable
        run: .\dist\MDCx.exe --smoke-test
