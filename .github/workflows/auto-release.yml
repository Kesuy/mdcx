name: Auto merge and release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: auto-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge-codex-pr:
    name: Merge trusted Codex PR and start release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate trusted Codex PR
        id: pr
        shell: bash
        run: |
          pr_number="${{ github.event.workflow_run.pull_requests[0].number }}"
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          already_merged="$(jq -r '.merged' <<<"$pr_json")"
          merge_sha="$(jq -r '.merge_commit_sha' <<<"$pr_json")"

          eligible=true
          if [ "$author" != "${{ github.repository_owner }}" ]; then eligible=false; fi
          if [ "$base_ref" != "master" ]; then eligible=false; fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then eligible=false; fi
          if [[ "$head_ref" != codex/* ]]; then eligible=false; fi
          if [ "$state" != "open" ] && [ "$already_merged" != "true" ]; then eligible=false; fi
          if [ "$draft" != "false" ]; then eligible=false; fi
          if [ "$head_sha" != "${{ github.event.workflow_run.head_sha }}" ]; then eligible=false; fi

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "already_merged=$already_merged" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Merge trusted Codex PR
        id: merge
        if: steps.pr.outputs.eligible == 'true' && steps.pr.outputs.already_merged != 'true'
        shell: bash
        run: |
          result="$(gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ steps.pr.outputs.number }}/merge" \
            -f merge_method=squash \
            -f sha="${{ steps.pr.outputs.head_sha }}")"
          merged="$(jq -r '.merged' <<<"$result")"
          merge_sha="$(jq -r '.sha' <<<"$result")"
          if [ "$merged" != "true" ] || [ -z "$merge_sha" ] || [ "$merge_sha" = "null" ]; then
            echo "$result"
            exit 1
          fi
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout merged commit
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.merge.outputs.sha || steps.pr.outputs.merge_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create version tag and dispatch Release
        if: steps.pr.outputs.eligible == 'true'
        env:
          RELEASE_COMMIT: ${{ steps.merge.outputs.sha || steps.pr.outputs.merge_sha }}
        run: python3 scripts/ensure_release.py

  release-manual-master-merge:
    name: Release version bump merged to master
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout master commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create version tag and dispatch Release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/ensure_release.py
