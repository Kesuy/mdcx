name: Auto merge and release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI completed successfully"
