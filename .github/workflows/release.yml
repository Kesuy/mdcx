name: Build and Release with Python3.13

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true
      prerelease:
        description: "是否作为预发布（pre-release）"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MDCX_OFFLINE: "1"
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1
      - run: uv sync --locked --all-extras --dev
      - run: uv run --locked pytest tests -q

  init-matrix:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # https://github.com/actions/runner/issues/1985#issuecomment-1573518052
      - name: Set matrix
        id: set-matrix
        run: |
          items=()

          # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners

          items+=('{"build": "macos", "os": "macos-latest", "arch": "aarch64"}')
          items+=('{"build": "windows", "os": "windows-latest", "arch": "x86_64"}')

          # 合并items到json数组
          matrix="matrix=["
          for ((i=0; i<${#items[@]}; i++)); do
            matrix+=" ${items[i]}"
            if ((i != ${#items[@]}-1)); then
              matrix+=","
            fi
          done
          matrix+="]"

          # 输出matrix到GITHUB_OUTPUT
          echo $matrix >> $GITHUB_OUTPUT

  build-app:
    needs: [test, init-matrix]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.init-matrix.outputs.matrix)}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release tag checkout
        id: verify-release-tag
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*$ ]]; then
            echo "发布 Tag 格式无效: $tag"
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "检出的提交与发布 Tag 不一致: HEAD=$head_commit tag=$tag_commit"
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          activate-environment: true

      - name: Set up python env
        run: uv sync --locked --all-extras --dev

      - name: Build macOS app - macOS
        if: ${{ matrix.build == 'macos' }}
        run: uv run scripts/build.py --create-dmg --version "$RELEASE_TAG" --debug

      - name: Build Windows app - Windows
        if: ${{ matrix.build == 'windows' }}
        env:
          PYTHONIOENCODING: utf-8
        run: uv run scripts/build.py --debug

      - name: Get changelog
        id: get-changelog
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          app_version="$(uv run python -c 'from mdcx.consts import LOCAL_VERSION; print(LOCAL_VERSION)')"
          if [ "$tag" != "$app_version" ]; then
            echo "发布 Tag 与应用版本不一致: tag=$tag app=$app_version"
            exit 1
          fi
          uv run python scripts/changelog.py \
            --tag "$tag" \
            --curated changelog.md \
            --output release-changelog.md
          if [ ! -s release-changelog.md ]; then
            echo "本次版本 changelog 生成失败，无法生成 Release 说明。"
            exit 1
          fi

      - name: Resolve release type
        id: release-type
        shell: bash
        run: |
          prerelease=false
          if [ "${{ github.event_name }}" = "release" ]; then
            prerelease="${{ github.event.release.prerelease }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT

      - name: Ensure release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            prerelease_flag=()
            if [ "${{ steps.release-type.outputs.prerelease }}" = "true" ]; then
              prerelease_flag+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "v$RELEASE_TAG" \
              --notes-file release-changelog.md \
              "${prerelease_flag[@]}" \
              || gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null
          fi

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.verify-release-tag.outputs.commit }}
        run: |
          if [ "${{ matrix.build }}" = "macos" ]; then
            source_file="dist/MDCx.dmg"
            extension="dmg"
          else
            source_file="dist/MDCx.exe"
            extension="exe"
          fi
          asset_name="MDCx-${RELEASE_TAG}-${{ matrix.build }}-${{ matrix.arch }}${{ matrix.tail }}-${RELEASE_COMMIT}.${extension}"
          cp "$source_file" "$RUNNER_TEMP/$asset_name"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$asset_name" \
            --repo "${{ github.repository }}" \
            --clobber

  normalize-release-title:
    name: Normalize release title
    needs: build-app
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Use standard v-prefixed title
        run: gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --title "v$RELEASE_TAG"
