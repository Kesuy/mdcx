name: Release

on:
  push:
    tags:
      - "*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true
      prerelease:
        description: "是否作为预发布（pre-release）"
        required: false
        default: "false"

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.verify-release.outputs.commit }}
    env:
      QT_QPA_PLATFORM: offscreen
      MDCX_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify release request and application version
        id: verify-release
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*$ ]]; then
            echo "发布 Tag 格式无效: $tag"
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          app_version="$(python -c 'from mdcx.consts import LOCAL_VERSION; print(LOCAL_VERSION)')"
          if [ "$tag" != "$app_version" ]; then
            echo "发布 Tag 与应用版本不一致: tag=$tag app=$app_version"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
            if [ "$head_commit" != "$tag_commit" ]; then
              echo "检出的提交与发布 Tag 不一致: HEAD=$head_commit tag=$tag_commit"
              exit 1
            fi
          fi
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Install Qt runtime and CJK fonts
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1 fonts-noto-cjk
      - run: uv run --locked pytest tests -q

  prepare-release:
    name: Prepare release tag
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.prepare-tag.outputs.commit }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.test.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
      - name: Create or verify release tag
        id: prepare-tag
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          tested_commit="${{ needs.test.outputs.commit }}"
          git fetch --force --tags origin
          if git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null 2>&1; then
            tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
            if [ "$tag_commit" != "$tested_commit" ]; then
              echo "Tag $tag 已存在但指向其他提交: tag=$tag_commit tested=$tested_commit"
              exit 1
            fi
          else
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "发布 Tag 不存在: $tag"
              exit 1
            fi
            git tag "$tag" "$tested_commit"
            git push origin "refs/tags/$tag"
            tag_commit="$tested_commit"
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

  build-app:
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: macos
            os: macos-latest
            arch: aarch64
            extension: dmg
          - build: windows
            os: windows-latest
            arch: x86_64
            extension: exe
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify release tag checkout
        id: verify-release-tag
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*$ ]]; then
            echo "发布 Tag 格式无效: $tag"
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "检出的提交与发布 Tag 不一致: HEAD=$head_commit tag=$tag_commit"
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          activate-environment: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Build and smoke macOS app
        if: ${{ matrix.build == 'macos' }}
        run: uv run --locked scripts/build.py --create-dmg --version "$RELEASE_TAG" --debug
      - name: Build and smoke Windows app
        if: ${{ matrix.build == 'windows' }}
        env:
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked scripts/build.py --debug
      - name: Check final asset and stage immutable name
        id: asset
        shell: bash
        run: |
          source_file="dist/MDCx.${{ matrix.extension }}"
          test -s "$source_file"
          asset_name="MDCx-${RELEASE_TAG}-${{ matrix.build }}-${{ matrix.arch }}-${{ steps.verify-release-tag.outputs.commit }}.${{ matrix.extension }}"
          mkdir -p release-assets
          cp "$source_file" "release-assets/$asset_name"
          echo "name=$asset_name" >> "$GITHUB_OUTPUT"
      - name: Upload verified build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.build }}
          path: release-assets/${{ steps.asset.outputs.name }}
          if-no-files-found: error

  publish-release:
    name: Publish complete release
    needs: build-app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Generate changelog after all builds pass
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          app_version="$(uv run --locked python -c 'from mdcx.consts import LOCAL_VERSION; print(LOCAL_VERSION)')"
          if [ "$tag" != "$app_version" ]; then
            echo "发布 Tag 与应用版本不一致: tag=$tag app=$app_version"
            exit 1
          fi
          uv run --locked python scripts/changelog.py \
            --tag "$tag" \
            --curated .github/release-notes.md \
            --output release-changelog.md
          test -s release-changelog.md
      - name: Download verified platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete asset set
        shell: bash
        run: |
          test "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 1
      - name: Create or reuse draft Release
        shell: bash
        run: |
          prerelease_flag=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            prerelease_flag+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "already_published=true" >> "$GITHUB_ENV"
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --verify-tag \
              --fail-on-no-commits \
              --draft \
              --title "v$RELEASE_TAG" \
              --notes-file release-changelog.md \
              "${prerelease_flag[@]}"
          fi
      - name: Upload all assets to draft Release
        if: ${{ env.already_published != 'true' }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "${{ github.repository }}" \
            --clobber
      - name: Verify uploaded Release assets
        shell: bash
        run: |
          mapfile -t expected_assets < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t remote_assets < <(
            gh release view "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --json assets \
              --jq '.assets[] | "\(.name)\t\(.size)"' \
              | sort
          )
          if [ "${#expected_assets[@]}" -ne 2 ] || [ "${#remote_assets[@]}" -ne 2 ]; then
            echo "Release 附件数量不完整: local=${#expected_assets[@]} remote=${#remote_assets[@]}"
            exit 1
          fi
          for asset_name in "${expected_assets[@]}"; do
            local_size="$(stat -c%s "release-assets/$asset_name")"
            if ! printf '%s\n' "${remote_assets[@]}" | grep -Fxq "$asset_name"$'\t'"$local_size"; then
              echo "Release 附件缺失或大小不一致: $asset_name ($local_size bytes)"
              exit 1
            fi
          done
      - name: Publish verified Release
        if: ${{ env.already_published != 'true' }}
        shell: bash
        run: |
          prerelease="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            prerelease="true"
          fi
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --title "v$RELEASE_TAG" \
            --notes-file release-changelog.md \
            --prerelease="$prerelease" \
            --draft=false
