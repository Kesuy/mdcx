name: Inspect published 3.8.8

on:
  pull_request:
    branches:
      - master
    types: [ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    if: github.head_ref == 'release-3.8.8-publish'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: 3.8.8
    steps:
      - name: Inspect release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json tagName,name,url,isDraft,isPrerelease,assets > /tmp/release.json
          {
            echo '### 3.8.8 release assets'
            echo
            jq -r '"Release: [\(.name)](\(.url))\nTag: `\(.tagName)`\nDraft: `\(.isDraft)`\nPrerelease: `\(.isPrerelease)`\nAssets (\(.assets|length)):\n" + ([.assets[] | "- `\(.name)` (\(.size) bytes)"] | join("\n"))' /tmp/release.json
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$REPO" --body-file /tmp/comment.md
