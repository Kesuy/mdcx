name: Diagnose 3.8.8 release

on:
  pull_request:
    branches:
      - master
    types: [ready_for_review]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  diagnose:
    if: github.head_ref == 'release-3.8.8-publish'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Inspect latest official release run
        shell: bash
        run: |
          set -euo pipefail
          master_sha="$(gh api "repos/$REPO/git/ref/heads/master" --jq '.object.sha')"
          run_id="$(gh api "repos/$REPO/actions/workflows/release.yml/runs?event=workflow_dispatch&branch=master&per_page=20" \
            --jq ".workflow_runs | map(select(.head_sha == \"$master_sha\")) | sort_by(.created_at) | reverse | .[0].id // empty")"
          test -n "$run_id"

          run_meta="$(gh api "repos/$REPO/actions/runs/$run_id")"
          jobs_json="$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100")"
          failed_log="$(gh run view "$run_id" --repo "$REPO" --log-failed 2>&1 || true)"
          failed_log="$(printf '%s\n' "$failed_log" | tail -n 180)"

          {
            echo '### 3.8.8 official release diagnostic'
            echo
            echo "Run ID: \`$run_id\`"
            echo "Run URL: $(printf '%s' "$run_meta" | jq -r '.html_url')"
            echo "Status: \`$(printf '%s' "$run_meta" | jq -r '.status')\` / \`$(printf '%s' "$run_meta" | jq -r '.conclusion')\`"
            echo "Head SHA: \`$(printf '%s' "$run_meta" | jq -r '.head_sha')\`"
            echo
            echo 'Jobs:'
            printf '%s' "$jobs_json" | jq -r '.jobs[] | "- `\(.name)`: `\(.status)` / `\(.conclusion)` (job id `\(.id)`)"'
            echo
            echo '<details><summary>Failed log tail</summary>'
            echo
            echo '```text'
            printf '%s\n' "$failed_log"
            echo '```'
            echo '</details>'
          } > /tmp/diagnostic.md

          gh pr comment "${{ github.event.pull_request.number }}" --repo "$REPO" --body-file /tmp/diagnostic.md
