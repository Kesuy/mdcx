name: Apply runtime layout fixes

on:
  push:
    branches:
      - codex/ui-runtime-layout-fixes-4.0.12

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ui-runtime-layout-fixes-4.0.12
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch canonical UI and failed-list spacing
        shell: python
        run: |
          from pathlib import Path
          import re

          ui_path = Path('mdcx/views/settings_page.ui')
          text = ui_path.read_text(encoding='utf-8')

          def make_label_wrap(label_name: str) -> None:
              global text
              marker = f'<widget class="QLabel" name="{label_name}">'
              start = text.index(marker)
              end = text.index('</widget>', start) + len('</widget>')
              block = text[start:end]
              updated, count = re.subn(
                  r'<sizepolicy hsizetype="[^"]+" vsizetype="Fixed">',
                  '<sizepolicy hsizetype="Expanding" vsizetype="Preferred">',
                  block,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'{label_name}: size policy not found')
              if '<property name="wordWrap">' in updated:
                  updated = re.sub(
                      r'<property name="wordWrap">\s*<bool>false</bool>\s*</property>',
                      '<property name="wordWrap">\n                        <bool>true</bool>\n                      </property>',
                      updated,
                      count=1,
                  )
              else:
                  updated = updated.replace(
                      '</widget>',
                      '  <property name="wordWrap">\n    <bool>true</bool>\n  </property>\n</widget>',
                      1,
                  )
              text = text[:start] + updated + text[end:]

          make_label_wrap('label_155')
          make_label_wrap('label_103')
          ui_path.write_text(text, encoding='utf-8')

          settings_test = Path('tests/controllers/test_settings_page_ui.py')
          tests = settings_test.read_text(encoding='utf-8')
          if 'test_narrow_long_help_labels_can_wrap' not in tests:
              tests += '''\n\ndef test_narrow_long_help_labels_can_wrap():\n    window, _controller_instance = _controller()\n\n    for label in (window.Ui.label_155, window.Ui.label_103):\n        assert label.sizePolicy().horizontalPolicy() == label.sizePolicy().Policy.Expanding\n        assert label.sizePolicy().verticalPolicy() == label.sizePolicy().Policy.Preferred\n        assert label.wordWrap()\n'''
          settings_test.write_text(tests, encoding='utf-8')

          log_path = Path('mdcx/controllers/main_window/log_controller.py')
          log_text = log_path.read_text(encoding='utf-8')
          old = '''    def show_hide_failed_list(self, show):\n        if show:\n            self.Ui.textBrowser_log_main_3.show()\n            has_retryable = not Flags.failed_records or any(record.retryable for record in Flags.failed_records)\n'''
          new = '''    def show_hide_failed_list(self, show):\n        if show:\n            # The legacy failed-list actions are intentionally drawn over this panel.\n            # Reserve viewport space so long failure text never sits underneath them.\n            self.Ui.textBrowser_log_main_3.setViewportMargins(0, 58, 0, 50)\n            self.Ui.textBrowser_log_main_3.show()\n            has_retryable = not Flags.failed_records or any(record.retryable for record in Flags.failed_records)\n'''
          if old not in log_text:
              raise SystemExit('show_hide_failed_list anchor not found')
          log_path.write_text(log_text.replace(old, new, 1), encoding='utf-8')

          responsive_test = Path('tests/controllers/test_responsive_layout.py')
          responsive = responsive_test.read_text(encoding='utf-8')
          if 'test_failed_log_overlay_reserves_text_space_for_actions' not in responsive:
              responsive += '''\n\ndef test_failed_log_overlay_reserves_text_space_for_actions():\n    window = generated_ui_window()\n    setup_responsive_ui(window)\n    window.resize(MIN_WINDOW_WIDTH, MIN_WINDOW_HEIGHT)\n    window.show()\n    APP.processEvents()\n    apply_responsive_layout(window)\n    window.Ui.stackedWidget.setCurrentWidget(window.Ui.page_log)\n\n    MyMAinWindow.show_hide_failed_list(window, True)\n    APP.processEvents()\n\n    browser = window.Ui.textBrowser_log_main_3\n    viewport = browser.viewport()\n    assert viewport.y() >= 58\n    assert browser.height() - viewport.geometry().bottom() - 1 >= 50\n    window.close()\n'''
          responsive_test.write_text(responsive, encoding='utf-8')
      - name: Install dependencies and regenerate UI
        run: |
          uv sync --locked --all-extras --dev
          uv run --locked python scripts/generate_ui.py
          git restore mdcx/views/MDCx_shell.py mdcx/views/posterCutTool.py mdcx/views/main_page.py mdcx/views/log_page.py mdcx/views/network_page.py mdcx/views/tool_page.py mdcx/views/about_page.py mdcx/views/nfo_overlay.py
          uv run --locked ruff format tests/controllers/test_settings_page_ui.py tests/controllers/test_responsive_layout.py mdcx/controllers/main_window/log_controller.py
          uv run --locked ruff check --fix tests/controllers/test_settings_page_ui.py tests/controllers/test_responsive_layout.py mdcx/controllers/main_window/log_controller.py
          uv run --locked ruff check tests/controllers/test_settings_page_ui.py tests/controllers/test_responsive_layout.py mdcx/controllers/main_window/log_controller.py
      - name: Run targeted UI tests
        env:
          QT_QPA_PLATFORM: offscreen
          MDCX_OFFLINE: '1'
        run: >-
          uv run --locked pytest
          tests/controllers/test_settings_page_ui.py
          tests/controllers/test_settings_layout.py
          tests/controllers/test_responsive_layout.py
          tests/controllers/test_failure_center.py
          -q
      - name: Render Windows runtime verification
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          MDCX_OFFLINE: '1'
        run: |
          @'
          from pathlib import Path
          from PyQt6.QtGui import QFont, QFontDatabase
          from PyQt6.QtWidgets import QApplication
          import mdcx.controllers.main_window.main_window as main_window_module
          from mdcx.controllers.main_window.main_window import MyMAinWindow
          from mdcx.controllers.main_window.responsive_layout import apply_responsive_layout
          from mdcx.models.flags import Flags

          main_window_module.check_version = lambda: None
          main_window_module.get_success_list = lambda: None
          main_window_module.save_remain_list = lambda: None
          main_window_module.show_netstatus = lambda: None
          MyMAinWindow.auto_start = lambda self: None

          app = QApplication.instance() or QApplication([])
          font_path = Path(r'C:\Windows\Fonts\msyh.ttc')
          if font_path.exists():
              QFontDatabase.addApplicationFont(str(font_path))
              app.setFont(QFont('Microsoft YaHei UI', 9))

          window = MyMAinWindow()
          window.show()
          app.processEvents()
          if not getattr(window, '_startup_finished', False):
              window._finish_startup()
          output = Path('ui-fix-check')
          output.mkdir(exist_ok=True)

          window.resize(880, 700)
          window.Ui.stackedWidget.setCurrentWidget(window.Ui.page_setting)
          apply_responsive_layout(window)
          app.processEvents()
          for index, name, scroll_name in (
              (2, 'website', 'scrollArea_8'),
              (10, 'network', 'scrollArea_3'),
          ):
              window.Ui.tabWidget.setCurrentIndex(index)
              apply_responsive_layout(window)
              app.processEvents()
              scroll = getattr(window.Ui, scroll_name)
              image = scroll.widget().grab().toImage()
              if not image.save(str(output / f'880-{name}.jpg'), 'JPG', 85):
                  raise SystemExit(f'failed to save {name} screenshot')

          Flags.success_list = {
              Path(rf'D:\Media\Library\TEST-{i:04d} 这是用于成功列表长路径显示测试的文件 2160p.mkv')
              for i in range(1, 31)
          }
          window.Ui.stackedWidget.setCurrentWidget(window.Ui.page_setting)
          window.pushButton_view_success_file_clicked()
          app.processEvents()
          assert window.Ui.widget_show_success.isVisible()
          assert len(window.Ui.textBrowser_show_success_list.toPlainText().splitlines()) == 30
          window.grab().toImage().save(str(output / '880-success-list.jpg'), 'JPG', 85)
          window.Ui.widget_show_success.hide()

          window.Ui.stackedWidget.setCurrentWidget(window.Ui.page_log)
          Flags.failed_records = []
          Flags.failed_list = []
          failed_lines = []
          for i in range(1, 36):
              path = Path(rf'D:\Media\Failed\Batch-{i:02d}\FAIL-{i:04d} long failure filename.mp4')
              Flags.failed_list.append((path, '网络请求超时，代理连接被重置；将在网络恢复后重试'))
              failed_lines.append(f'{path}\n    原因：网络请求超时，代理连接被重置；将在网络恢复后重试')
          window.Ui.textBrowser_log_main_3.setPlainText('\n'.join(failed_lines))
          window.show_hide_failed_list(True)
          apply_responsive_layout(window)
          app.processEvents()
          browser = window.Ui.textBrowser_log_main_3
          viewport = browser.viewport()
          assert viewport.y() >= 58
          assert browser.height() - viewport.geometry().bottom() - 1 >= 50
          assert window.Ui.pushButton_scraper_failed_list.isVisible()
          assert window.Ui.pushButton_save_failed_list.isVisible()
          window.grab().toImage().save(str(output / '880-failed-list.jpg'), 'JPG', 85)

          for timer_name in ('timer', 'timer_scrape', 'timer_update', 'timer_remain_task'):
              timer = getattr(window, timer_name, None)
              if timer is not None:
                  timer.stop()
          window.hide()
          window.deleteLater()
          app.processEvents()
          '@ | Set-Content -Encoding utf8 .runtime_layout_check.py
          uv run --locked python .runtime_layout_check.py
          Remove-Item .runtime_layout_check.py
      - name: Upload runtime verification
        uses: actions/upload-artifact@v4
        with:
          name: runtime-layout-fix-check
          path: ui-fix-check
          if-no-files-found: error
          retention-days: 1
      - name: Commit product changes and remove bootstrap workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-runtime-layout-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mdcx/views/settings_page.ui mdcx/views/settings_page.py mdcx/controllers/main_window/log_controller.py tests/controllers/test_settings_page_ui.py tests/controllers/test_responsive_layout.py .github/workflows/apply-runtime-layout-fixes.yml
          git diff --cached --check
          git commit -m "fix: correct narrow runtime UI clipping"
          git push origin HEAD:codex/ui-runtime-layout-fixes-4.0.12
