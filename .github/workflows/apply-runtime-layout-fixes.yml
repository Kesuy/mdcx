name: Apply runtime layout fixes

on:
  push:
    branches:
      - codex/ui-runtime-layout-fixes-4.0.12

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ui-runtime-layout-fixes-4.0.12
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch canonical settings UI and regression test
        shell: python
        run: |
          from pathlib import Path
          import re

          ui_path = Path('mdcx/views/settings_page.ui')
          text = ui_path.read_text(encoding='utf-8')

          def make_label_wrap(label_name: str) -> None:
              global text
              marker = f'<widget class="QLabel" name="{label_name}">'
              start = text.index(marker)
              end = text.index('</widget>', start) + len('</widget>')
              block = text[start:end]
              updated, count = re.subn(
                  r'<sizepolicy hsizetype="[^"]+" vsizetype="Fixed">',
                  '<sizepolicy hsizetype="Expanding" vsizetype="Preferred">',
                  block,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'{label_name}: size policy not found')
              if '<property name="wordWrap">' in updated:
                  updated = re.sub(
                      r'<property name="wordWrap">\s*<bool>false</bool>\s*</property>',
                      '<property name="wordWrap">\n                        <bool>true</bool>\n                      </property>',
                      updated,
                      count=1,
                  )
              else:
                  updated = updated.replace(
                      '</widget>',
                      '  <property name="wordWrap">\n    <bool>true</bool>\n  </property>\n</widget>',
                      1,
                  )
              text = text[:start] + updated + text[end:]

          make_label_wrap('label_155')
          make_label_wrap('label_103')
          ui_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/controllers/test_settings_page_ui.py')
          tests = test_path.read_text(encoding='utf-8')
          if 'test_narrow_long_help_labels_can_wrap' not in tests:
              tests += '''\n\ndef test_narrow_long_help_labels_can_wrap():\n    window, _controller_instance = _controller()\n\n    for label in (window.Ui.label_155, window.Ui.label_103):\n        assert label.sizePolicy().horizontalPolicy() == label.sizePolicy().Policy.Expanding\n        assert label.sizePolicy().verticalPolicy() == label.sizePolicy().Policy.Preferred\n        assert label.wordWrap()\n'''
          test_path.write_text(tests, encoding='utf-8')
      - name: Install dependencies and regenerate UI
        run: |
          uv sync --locked --all-extras --dev
          uv run --locked python scripts/generate_ui.py
          git restore mdcx/views/MDCx_shell.py mdcx/views/posterCutTool.py mdcx/views/main_page.py mdcx/views/log_page.py mdcx/views/network_page.py mdcx/views/tool_page.py mdcx/views/about_page.py mdcx/views/nfo_overlay.py
          uv run --locked ruff format tests/controllers/test_settings_page_ui.py
          uv run --locked ruff check --fix tests/controllers/test_settings_page_ui.py
          uv run --locked ruff check tests/controllers/test_settings_page_ui.py
      - name: Run targeted UI tests
        env:
          QT_QPA_PLATFORM: offscreen
          MDCX_OFFLINE: '1'
        run: uv run --locked pytest tests/controllers/test_settings_page_ui.py tests/controllers/test_settings_layout.py -q
      - name: Render 880px runtime verification screenshots
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
          MDCX_OFFLINE: '1'
        run: |
          from pathlib import Path
          from PyQt6.QtGui import QFont, QFontDatabase
          from PyQt6.QtWidgets import QApplication, QScrollArea
          import mdcx.controllers.main_window.main_window as main_window_module
          from mdcx.controllers.main_window.main_window import MyMAinWindow
          from mdcx.controllers.main_window.responsive_layout import apply_responsive_layout

          main_window_module.check_version = lambda: None
          main_window_module.get_success_list = lambda: None
          main_window_module.save_remain_list = lambda: None
          main_window_module.show_netstatus = lambda: None
          MyMAinWindow.auto_start = lambda self: None

          app = QApplication.instance() or QApplication([])
          font_path = Path(r'C:\Windows\Fonts\msyh.ttc')
          if font_path.exists():
              QFontDatabase.addApplicationFont(str(font_path))
              app.setFont(QFont('Microsoft YaHei UI', 9))

          window = MyMAinWindow()
          window.show()
          app.processEvents()
          if not getattr(window, '_startup_finished', False):
              window._finish_startup()
          window.resize(880, 700)
          window.Ui.stackedWidget.setCurrentWidget(window.Ui.page_setting)
          apply_responsive_layout(window)
          app.processEvents()

          output = Path('ui-fix-check')
          output.mkdir(exist_ok=True)
          for index, name in ((2, 'website'), (10, 'network')):
              window.Ui.tabWidget.setCurrentIndex(index)
              apply_responsive_layout(window)
              app.processEvents()
              scroll = next(
                  item for item in window.Ui.tabWidget.currentWidget().findChildren(QScrollArea)
                  if item.isVisibleTo(window) and item.widget() is not None
              )
              image = scroll.widget().grab().toImage()
              if not image.save(str(output / f'880-{name}.jpg'), 'JPG', 85):
                  raise SystemExit(f'failed to save {name} screenshot')

          for timer_name in ('timer', 'timer_scrape', 'timer_update', 'timer_remain_task'):
              timer = getattr(window, timer_name, None)
              if timer is not None:
                  timer.stop()
          window.hide()
          window.deleteLater()
          app.processEvents()
      - name: Upload runtime verification
        uses: actions/upload-artifact@v4
        with:
          name: runtime-layout-fix-check
          path: ui-fix-check
          if-no-files-found: error
          retention-days: 1
      - name: Commit product changes and remove bootstrap workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-runtime-layout-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mdcx/views/settings_page.ui mdcx/views/settings_page.py tests/controllers/test_settings_page_ui.py .github/workflows/apply-runtime-layout-fixes.yml
          git diff --cached --check
          git commit -m "fix: wrap narrow settings help text"
          git push origin HEAD:codex/ui-runtime-layout-fixes-4.0.12
