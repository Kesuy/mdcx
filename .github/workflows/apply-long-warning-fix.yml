name: Apply long warning wrap fix

on:
  push:
    branches:
      - codex/ui-result-list-4.0.12

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ui-result-list-4.0.12
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch canonical UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('mdcx/views/settings_page.ui')
          text = path.read_text(encoding='utf-8')
          marker = '<widget class="QLabel" name="label_300">'
          start = text.index(marker)
          end = text.index('</widget>', start) + len('</widget>')
          block = text[start:end]
          original = block
          block = block.replace(
              '<sizepolicy hsizetype="Fixed" vsizetype="Fixed">',
              '<sizepolicy hsizetype="Expanding" vsizetype="Preferred">',
              1,
          )
          block = block.replace('<enum>Qt::RightToLeft</enum>', '<enum>Qt::LeftToRight</enum>', 1)
          block, changed = re.subn(
              r'(<property name="wordWrap">\s*<bool>)false(</bool>\s*</property>)',
              r'\1true\2',
              block,
              count=1,
          )
          if changed == 0 and '<property name="wordWrap">' not in block:
              block = block.replace(
                  '</widget>',
                  '  <property name="wordWrap">\n   <bool>true</bool>\n  </property>\n</widget>',
                  1,
              )
          if block == original:
              raise SystemExit('label_300 source block did not change')
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
      - name: Regenerate settings UI
        run: |
          uv sync --locked --all-extras --dev
          uv run --locked python scripts/generate_ui.py
          git restore mdcx/views/MDCx_shell.py mdcx/views/posterCutTool.py mdcx/views/main_page.py mdcx/views/log_page.py mdcx/views/network_page.py mdcx/views/tool_page.py mdcx/views/about_page.py mdcx/views/nfo_overlay.py
      - name: Commit UI source and generated file
        run: |
          rm .github/workflows/apply-long-warning-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mdcx/views/settings_page.ui mdcx/views/settings_page.py .github/workflows/apply-long-warning-fix.yml
          git diff --cached --check
          git commit -m "fix: wrap long settings warning"
          git push origin HEAD:codex/ui-result-list-4.0.12
