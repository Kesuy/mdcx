name: AV-Wiki Live Verify

on:
  push:
    branches:
      - codex/fix-avwiki-prefixed-numbers-4.0.23

permissions:
  contents: read

jobs:
  live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Query AV-Wiki through MDCx
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          import asyncio
          from mdcx.core.avwiki import get_actorname

          NUMBERS = [
              "200GANA-3259",
              "420ERK-085",
              "420HOI-304",
              "420HPT-034",
              "435MFC-277",
              "583ERKR-1032",
              "766ESDX-046",
              "821SBTH-005",
          ]

          async def main():
              for number in NUMBERS:
                  ok, value = await get_actorname(number)
                  print(f"LIVE_AVWIKI number={number} ok={ok} value={value}")

          asyncio.run(main())
          PY
