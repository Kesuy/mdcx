name: Apply settings warning source fix

on:
  push:
    branches:
      - codex/ui-result-list-4.0.12

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ui-result-list-4.0.12
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch canonical settings UI and audit danger labels
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('mdcx/views/settings_page.ui')
          text = path.read_text(encoding='utf-8')
          marker = '<widget class="QLabel" name="label_271">'
          start = text.index(marker)
          end = text.index('</widget>', start) + len('</widget>')
          block = text[start:end]
          original = block
          block = block.replace(
              '<sizepolicy hsizetype="Fixed" vsizetype="Fixed">',
              '<sizepolicy hsizetype="Expanding" vsizetype="Preferred">',
              1,
          )
          block = block.replace('<enum>Qt::RightToLeft</enum>', '<enum>Qt::LeftToRight</enum>', 1)
          block = block.replace(
              '<set>Qt::AlignCenter</set>',
              '<set>Qt::AlignLeading|Qt::AlignLeft|Qt::AlignVCenter</set>',
              1,
          )
          if block == original:
              raise SystemExit('label_271 source block did not change')
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')

          print('Settings danger-label audit:')
          for match in re.finditer(r'<widget class="QLabel" name="([^"]+)">(.*?)</widget>', text, re.S):
              name, body = match.groups()
              if '<string>danger</string>' not in body:
                  continue
              policy = re.search(r'<sizepolicy hsizetype="([^"]+)" vsizetype="([^"]+)">', body)
              direction = re.search(r'<property name="layoutDirection">\s*<enum>([^<]+)</enum>', body)
              alignment = re.search(r'<property name="alignment">\s*<set>([^<]+)</set>', body)
              print(name, 'policy=', policy.groups() if policy else None,
                    'direction=', direction.group(1) if direction else None,
                    'alignment=', alignment.group(1) if alignment else None)
      - name: Regenerate UI modules
        run: |
          uv sync --locked --all-extras --dev
          uv run --locked python scripts/generate_ui.py
          git restore mdcx/views/MDCx_shell.py mdcx/views/posterCutTool.py mdcx/views/main_page.py mdcx/views/log_page.py mdcx/views/network_page.py mdcx/views/tool_page.py mdcx/views/about_page.py mdcx/views/nfo_overlay.py
      - name: Commit source and generated settings UI
        run: |
          rm .github/workflows/apply-settings-warning-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mdcx/views/settings_page.ui mdcx/views/settings_page.py .github/workflows/apply-settings-warning-fix.yml
          git diff --cached --check
          git commit -m "fix: align settings warning text"
          git push origin HEAD:codex/ui-result-list-4.0.12
