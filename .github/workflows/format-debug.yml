name: Ruff Format Diff

on:
  push:
    branches:
      - codex/fix-avwiki-prefixed-numbers-4.0.23

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Show Ruff formatting diff
        shell: bash
        run: uvx ruff@0.15.12 format --diff mdcx/core/translate.py || true
