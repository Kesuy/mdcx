[tool.setuptools]
py-modules = ['mdcx', 'scripts']

[tool.setuptools.dynamic]
version = {attr = "mdcx.consts.LOCAL_VERSION"}

[project]
name = "mdcx"
dynamic = ["version"]
description = "mdcx"
readme = "README.md"
requires-python = ">=3.13.4" # we need os.path.ALLOW_MISSING and type parameter defaults
dependencies = [
    "aiofiles==24.1.0",
    "aiolimiter==1.2.1",
    "av>=15.0.0",
    "beautifulsoup4==4.13.4",
    "curl-cffi==0.16.1",
    "httpx[socks]>=0.28.1",
    "lxml>=6.1.0",
    "openai==3.5.0",
    "keyring>=25.6.0",
    "oshash==0.1.1",
    "parsel>=1.10.0",
    "pillow==12.3.0",
    "ping3==4.0.4",
    "pydantic-settings>=2.14.2",
    "pyqt6==6.11.0",
    "zhconv==1.4.3",
    "opencv-contrib-python-headless==4.13.0.92",
    "jinja2>=3.1.6",
]

[project.scripts]
crawl = "mdcx.cmd.crawl:app"
gen_enums = "mdcx.cmd.gen_enums:main"
build = "scripts.build:main"
bump = "scripts.bump:app"
changelog = "scripts.changelog:app"

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.6.0",
    "ipykernel>=6.30.1",
    "pre-commit>=4.2.0",
    "pyinstaller>=6.22.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "rich>=14.1.0",
    "ruff>=0.15.0,<0.16.0",
    "typer>=0.16.0",
    "types-lxml>=2025.3.30",
]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:UserWarning:zhconv.zhconv",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
force-exclude = true
extend-exclude = ["*_generated.py", "mdcx/views/*.py"]

[tool.ruff.lint]
select = [
    "I",        # isort
    "UP",       # pyupgrade
    "E",        # pycodestyle
    "F",        # Pyflakes
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "FAST",     # FastAPI
    "ASYNC230", # async functions should not use blocking file I/O
    "ASYNC251", # async functions should not call time.sleep
]
ignore = [
    "E501", # line length is handled by the formatter where practical
    "B005", # multi-character strip arguments are intentional in legacy parsing paths
    "B007", # some loop variables are retained for readability/context
    "B904", # legacy exception paths do not consistently chain exceptions yet
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.uv]
package = true
cache-dir = ".uv-cache"
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
